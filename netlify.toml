[build]
  command = "npm run check && node scripts/build-netlify-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  API_ORIGIN = "https://api-homolog.nexasst.com.br"

# Single shared AWS API for now. Production branch=main in Netlify.
# Branch previews also use this API and share its database.
# Never set DB_PASSWORD, SMTP_PASSWORD or AWS credentials in frontend variables.

[[headers]]
  for = "/v1/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
